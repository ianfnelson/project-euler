# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # DELIBERATELY INSECURE - added only to validate GitHub CodeQL scanning.
    # CodeQL: actions/code-injection - untrusted PR title interpolated into a
    # shell run block (CWE-94). Do not merge.
    - name: Log PR title
      run: |
        echo "Building PR: ${{ github.event.pull_request.title }}"
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
